<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
         const heading = React.createElement('h1',{},"Hello from React!");

         const root = ReactDOM.createRoot(document.getElementById('root'));
         
         root.render(heading);
    </script>
</body>
</html>


<!-- How to create h1 using react in html
i. create what you need like above we did h1 in that it takes 3 parameter-
    the element
    object
    content

ii. where we need to render it as we have done it in root 
    we created root and selected the id

iii. at last render the root to show the content -->
